defaults:
  - base

max_duration: 5ep
lr: 1e-5
batch_size: 8
eval_interval: 1
seed: ${seed}
model_name_or_path: "ISTA-DASLab/Meta-Llama-3-8B-Instruct"
save_merged_model: False

lora:
  lr: ${finetuning.lr}
  rank: 8
  alpha: 16
  target_modules: 'all-linear'
  dropout: 0.05
  impl: auto
  dtype: bf16
  grad_acc_mode: mean_squared  # 'mean' or 'mean_squared': how to accumulate gradients
  schedule: #TODO

scheduler:
  t_warmup: 8ba

num_cpu_threads: 1
