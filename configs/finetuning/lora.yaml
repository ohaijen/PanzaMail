defaults:
  - base

max_duration: 5ep
lr: 1e-5
batch_size: 8
train_batch_size: 8
device_train_microbatch_size: 1
eval_interval: 8
seed: ${seed}
#model_name_or_path: "Qwen/Qwen3.5-4B"
model_name_or_path: "Qwen/Qwen3-4B-Instruct-2507"
save_merged_model: False

lora:
  lr: ${finetuning.lr}
  rank: 8
  alpha: 16
  target_modules: 'all-linear'
  dropout: 0.05
  impl: auto
  dtype: bf16
  grad_acc_mode: mean_squared  # 'mean' or 'mean_squared': how to accumulate gradients
  schedule: #TODO
  #task_type: CAUSAL_LM

scheduler:
  #constant_with_warmup, cosine_with_warmup, inv_sqrt_with_warmup, linear_decay_with_warmup
  t_warmup: 8ba


mlx:
  # If set, iters overrides epoch-based conversion from max_duration.
  iters:
  validation_split: 0.1
  optimizer: adam
  num_layers: 36
  steps_per_report: 10
  steps_per_eval: 200
  val_batches: -1
  save_every: 100
  grad_accumulation_steps: 1
  grad_checkpoint: false
  # Keep disabled for prompt/completion datasets unless chat-format data is used.
  mask_prompt: false
  test_after_train: false
  test_batches: 100
  dry_run: false

num_cpu_threads: 1
