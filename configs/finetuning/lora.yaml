defaults:
  - base

max_duration: 5ep
lr: 1e-5
batch_size: 8
eval_interval: 1
seed: ${seed}
model_name_or_path: "Qwen/Qwen3-4B-Instruct-2507"
save_merged_model: False

lora:
  lora_lr: ${finetuning.lr}
  r: 8
  lora_alpha: 16
  target_modules: all-linear
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM

scheduler:
  t_warmup: 8ba

mlx:
  # If set, iters overrides epoch-based conversion from max_duration.
  iters:
  validation_split: 0.1
  optimizer: adam
  num_layers: 36
  steps_per_report: 10
  steps_per_eval: 200
  val_batches: -1
  save_every: 100
  grad_accumulation_steps: 1
  grad_checkpoint: false
  # Keep disabled for prompt/completion datasets unless chat-format data is used.
  mask_prompt: false
  test_after_train: false
  test_batches: 100
  dry_run: false

num_cpu_threads: 1
