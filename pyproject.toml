[project]
name = "panza_mail"
version = "2026.05.22"
description = "A personal email assistant, trained and running on-device."
dependencies = [
    "torch>=2.2",
    "ollama",
    "omegaconf",
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-dotenv",
    "hydra-core",
    "langchain",
    "langchain-community",
    "sentence-transformers",
    "faiss-cpu",
    "gradio",
    "mauve-text",
    "evaluate",
    "torchmetrics",
    "nltk",
    "accelerate",
    "nicegui",
    "langdetect"
]

[project.optional-dependencies]
training = [
    "langdetect",
    "fire",
    "gradio",
    "cmake",
    "packaging",
    "transformers",
    "datasets",
    "peft",
    "accelerate",
]
training_lora = [
    "transformers",
    "datasets",
    "peft",
    "accelerate",
]
training_mps = [
    "transformers",
    "datasets",
    "accelerate",
]
inference_mlx = [
    "mlx>=0.29.0; platform_system == 'Darwin'",
    "mlx-lm>=0.30.0; platform_system == 'Darwin'",
]
training_mlx = [
    "mlx>=0.29.0; platform_system == 'Darwin'",
    "mlx-lm>=0.30.0; platform_system == 'Darwin'",
    "transformers",
    "datasets",
]
contributing = [
    "pre-commit",
]

[build-system]
requires = ["setuptools >= 61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]

[dev-dependencies]
pytest = "*"
